<svg xmlns="http://www.w3.org/2000/svg" width="1024" height="1024" viewBox="0 0 1024 1024">
<defs>
  <linearGradient id="sky" x1="0" y1="0" x2="0" y2="1">
    <stop offset="0" stop-color="#2A86A6"/><stop offset="1" stop-color="#134B5F"/>
  </linearGradient>
  <linearGradient id="beamL" x1="1" y1="0" x2="0" y2="0">
    <stop offset="0" stop-color="#FFD58A" stop-opacity="0.85"/><stop offset="1" stop-color="#FFD58A" stop-opacity="0"/>
  </linearGradient>
  <linearGradient id="beamR" x1="0" y1="0" x2="1" y2="0">
    <stop offset="0" stop-color="#FFD58A" stop-opacity="0.85"/><stop offset="1" stop-color="#FFD58A" stop-opacity="0"/>
  </linearGradient>
  <radialGradient id="lamp" cx="0.5" cy="0.5" r="0.5">
    <stop offset="0" stop-color="#FFF4DC"/><stop offset="1" stop-color="#F2A93B"/>
  </radialGradient>
  <clipPath id="tower"><path d="M436,840 L588,840 L562,470 L462,470 Z"/></clipPath>
</defs>
<rect width="1024" height="1024" fill="url(#sky)"/>
<!-- Lichtkegel -->
<path d="M512,395 L40,250 L40,520 Z" fill="url(#beamL)"/>
<path d="M512,395 L984,250 L984,520 Z" fill="url(#beamR)"/>
<!-- Turm mit Streifen -->
<path d="M436,840 L588,840 L562,470 L462,470 Z" fill="#FFFFFF"/>
<g clip-path="url(#tower)">
  <rect x="400" y="560" width="224" height="70" fill="#F2A93B"/>
  <rect x="400" y="720" width="224" height="70" fill="#F2A93B"/>
  <path d="M512,470 L562,470 L588,840 L512,840 Z" fill="#134B5F" fill-opacity="0.12"/>
</g>
<!-- Galerie, Laternenraum, Dach -->
<rect x="438" y="440" width="148" height="34" rx="8" fill="#FFFFFF"/>
<rect x="468" y="352" width="88" height="90" rx="10" fill="url(#lamp)"/>
<path d="M468,352 L556,352" stroke="#FFFFFF" stroke-width="10"/>
<path d="M452,356 L572,356 L512,290 Z" fill="#FFFFFF"/>
<circle cx="512" cy="282" r="16" fill="#FFFFFF"/>
<!-- Wellen -->
<path d="M120,880 q65,-40 130,0 t130,0 t130,0 t130,0 t130,0 t130,0" fill="none" stroke="#FFFFFF" stroke-opacity="0.85" stroke-width="30" stroke-linecap="round"/>
<path d="M200,950 q65,-40 130,0 t130,0 t130,0 t130,0 t130,0" fill="none" stroke="#FFFFFF" stroke-opacity="0.45" stroke-width="26" stroke-linecap="round"/>
</svg>