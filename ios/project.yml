# XcodeGen-Spezifikation: `xcodegen generate` erzeugt Paketlotse.xcodeproj
name: Paketlotse
options:
  bundleIdPrefix: de.paketlotse
  deploymentTarget:
    iOS: "17.0"
  developmentLanguage: de

packages:
  PaketlotseCore:
    path: PaketlotseCore

targets:
  Paketlotse:
    type: application
    platform: iOS
    sources:
      - path: Paketlotse
    dependencies:
      - package: PaketlotseCore
    configFiles:
      Debug: Config/Base.xcconfig
      Release: Config/Base.xcconfig
    info:
      path: Paketlotse/Info.plist
      properties:
        CFBundleDisplayName: Paketlotse
        CFBundleDevelopmentRegion: de
        UILaunchScreen: {}
        UISupportedInterfaceOrientations:
          - UIInterfaceOrientationPortrait
        NSCameraUsageDescription: "Paketlotse nutzt die Kamera, um Barcodes auf Versandlabels zu scannen und Pakete zu vermessen. Die Bilder werden nur auf deinem Gerät verarbeitet."
        NSLocationWhenInUseUsageDescription: "Paketlotse nutzt deinen Standort, um Paketshops und Packstationen in deiner Nähe zu zeigen. Er wird nicht gespeichert."
        DHLAPIKey: "$(DHL_API_KEY)"
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: de.paketlotse.app
        MARKETING_VERSION: "0.1.0"
        CURRENT_PROJECT_VERSION: "1"
        SWIFT_VERSION: "5.10"
        TARGETED_DEVICE_FAMILY: "1"
        ENABLE_PREVIEWS: YES
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon


schemes:
  Paketlotse:
    build:
      targets:
        Paketlotse: all
    run:
      config: Debug
      # Lokale StoreKit-Testumgebung: Käufe ohne App Store Connect testen.
      storeKitConfiguration: StoreKit/Paketlotse.storekit
    archive:
      config: Release
